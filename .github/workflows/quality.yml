name: PR Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Publish exact formatter diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bunx prettier --write src/routes/index.tsx src/components/Nav.tsx src/lib/seo.ts src/lib/llms.ts src/lib/course-categories.ts
          git diff -- src/routes/index.tsx src/components/Nav.tsx src/lib/seo.ts src/lib/llms.ts src/lib/course-categories.ts > /tmp/format.diff
          if test -s /tmp/format.diff; then
            {
              echo 'Exact formatter diff:'
              echo
              echo '```diff'
              cat /tmp/format.diff
              echo '```'
            } > /tmp/comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
            exit 1
          fi

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint and formatting
        run: bun run lint

      - name: Build and prerender every public page
        env:
          BASE_PATH: /
        run: bun run build:pages

      - name: Verify search and AI outputs
        run: |
          set -euo pipefail
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/llms.txt
          test -s dist/llms-full.txt
          test -s dist/index.md
          test -s dist/course-spoken-english.md
          test -s dist/workplace-english-course-online-india.html
          test -s dist/workplace-english-course-online-india.md
          test -s dist/blog/english-for-office-meetings.html
          test -s dist/blog/english-for-bpo-customer-support.html
          grep -q 'rel="canonical"' dist/index.html
          grep -q 'application/ld+json' dist/index.html
          grep -q 'Never in a Batch Bigger Than 6' dist/index.html
          grep -q 'Choose the Goal You Need Now' dist/index.html
          grep -q 'Speak Confidently' dist/index.html
          grep -q 'Work &amp; Career' dist/index.html
          grep -q 'IELTS Preparation' dist/index.html
          grep -q 'Career Guidance' dist/index.html
          grep -q 'English communication' dist/index.html
          grep -q 'View all courses' dist/index.html
          grep -q 'View Career Counselling' dist/index.html
          grep -q 'Explore both programmes' dist/index.html
          grep -q 'id="speak-confidently"' dist/english-career.html
          grep -q 'id="work-and-career"' dist/english-career.html
          grep -q 'id="ielts-preparation"' dist/english-career.html
          grep -q 'id="career-guidance"' dist/english-career.html
          grep -q '6 months · up to 2 classes/week' dist/course-spoken-english.html
          grep -q '09:00–12:00 IST' dist/course-spoken-english.html
          grep -q 'Workplace English' dist/course-business-english.html
          grep -q 'Workplace English' dist/workplace-english-course-online-india.html
          grep -q 'workplace-english-course-online-india' dist/sitemap.xml
          grep -q 'english-for-office-meetings' dist/sitemap.xml
          grep -q 'english-for-bpo-customer-support' dist/sitemap.xml
          grep -q 'does not currently issue a course certificate' dist/llms.txt
          if grep -REqi 'Lead ref:|utm_source|lws_campaign|googletagmanager|data-analytics' dist; then
            echo "::error::Tracking or campaign identifiers leaked into the public build"
            exit 1
          fi
          if grep -REqi '1:1 on most courses|1:1 private sessions on most courses' dist; then
            echo "::error::The site still promises recurring 1:1 English sessions"
            exit 1
          fi
          if grep -REqi 'Compare this category|Compare all 6' dist/index.html; then
            echo "::error::Redundant comparison copy returned to course discovery"
            exit 1
          fi
          if grep -q 'Our Learning Track' dist/index.html; then
            echo "::error::The old single-track homepage card returned"
            exit 1
          fi
          if grep -q '"repeatCount":' dist/course-*.html; then
            echo "::error::Course schema turns the maximum weekly frequency into an exact session count"
            exit 1
          fi
          if grep -Eqi '3 classes/week|three classes a week|3 live sessions/week' dist/course-spoken-english.html; then
            echo "::error::Spoken English still contains the obsolete three-day schedule"
            exit 1
          fi
          if grep -Eqi 'WhatsApp in Minutes|Reply in Minutes' dist/course-spoken-english.html dist/english-career.html; then
            echo "::error::A response-time promise still contradicts the published service window"
            exit 1
          fi
          if grep -q '<div id="root"></div>' dist/index.html; then
            echo "::error::Homepage was not prerendered"
            exit 1
          fi
