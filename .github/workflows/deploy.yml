# Builds the static site and publishes it to GitHub Pages
# (https://www.learnwithsmile.app). Runs on every push to main, or by hand from
# the Actions tab ("Run workflow").
#
# One job on purpose: every extra job waits for its own machine. The checks and
# the IndexNow push live in scripts/ci/ so they can be run locally too.
#
# Note: the "Evaluating build-deploy.if … Result: true" lines at the top of the
# job log are printed by GitHub for every job. They are not a step here and take
# no time.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A deploy that is already publishing is never cut off;
# runs queued behind it collapse to the newest commit, so the latest main ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # The whole job takes about a minute; the default cap is 6 hours.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build and prerender
        run: |
          # Custom domain (public/CNAME) → site at /. Otherwise a project page
          # at /<repo>/.
          if [ -f public/CNAME ]; then base=/; else base="/${GITHUB_REPOSITORY##*/}/"; fi
          BASE_PATH="$base" bun run build:pages

      - name: Verify the built site
        run: bash scripts/ci/verify-dist.sh

      - uses: actions/configure-pages@v6

      # include-hidden-files publishes /.well-known/ (llms.txt, llms.json,
      # ai-plugin.json, openapi.json). After a Pages API/OIDC failure start a
      # fresh run: re-running only this job can leave duplicate artifacts.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Wait for Pages artifact consistency
        run: sleep 20

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Notify Bing and IndexNow
        continue-on-error: true
        run: bash scripts/ci/indexnow.sh
