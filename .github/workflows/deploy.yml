name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute base path
        id: base
        run: |
          # For a project page (user.github.io/<repo>/) set base = /<repo>/.
          # For a user/org root page or a custom CNAME, leave base = /.
          if [ -f public/CNAME ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${GITHUB_REPOSITORY##*/}"
            echo "base=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and prerender static pages
        env:
          BASE_PATH: ${{ steps.base.outputs.base }}
        run: bun run build:pages

      - name: SPA 404 fallback
        run: |
          # Every real route is now a static file on disk (see
          # scripts/prerender.mjs), so 404.html only ever serves genuinely
          # missing URLs — which should return 404, as they now do. It uses the
          # SPA shell rather than a prerendered page so the client router can
          # still resolve anything added after this build.
          cp dist-prerender/spa-shell.html dist/404.html
          touch dist/.nojekyll

      - name: Verify crawlability
        run: |
          # Fails the deploy if the prerender silently regressed to a blank SPA
          # shell — the exact failure this pipeline exists to prevent.
          set -euo pipefail
          for page in index course-ielts about-us; do
            file="dist/${page}.html"
            [ "$page" = "index" ] && file="dist/index.html"
            if ! grep -q 'rel="canonical"' "$file"; then
              echo "::error::$file has no canonical tag"; exit 1
            fi
            if ! grep -q 'application/ld+json' "$file"; then
              echo "::error::$file has no structured data"; exit 1
            fi
            if grep -q '<div id="root"></div>' "$file"; then
              echo "::error::$file was not prerendered — #root is empty"; exit 1
            fi
          done
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/llms.txt
          echo "Crawlability checks passed for $(ls dist/*.html | wc -l) static pages."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
