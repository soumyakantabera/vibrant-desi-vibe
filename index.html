<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      This file is only the SPA shell. `scripts/prerender.mjs` strips the title
      and description below and replaces them with each route's own metadata
      when it writes the static pages, so do not treat these as the site's
      real tags — edit src/lib/seo.ts instead.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Font loading optimization -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical fonts for faster initial render -->
    <link rel="preload" href="https://fonts.gstatic.com/s/manrope/v15/xn7gYBCvU-DLs5J8FWW0CwzDdYw3UT_SfbAcEeT_qS-l3dJlw9F-KSy9q2zUrvAoOhVpVgxmjKxSC2FGlKkz.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/sora/v14/xn7gYBCvU-DLs5J8FWW0CwzDdYw3UT_SfbAcEeT_qS-l3dJlw9F-KSy9qmVetvAoOhVpVgxmjKxSC2FGlKkz.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/materialsymbolsrounded/v153/-ZpMEZVd6bPn-B25SN_sFkxN.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block" />
    <title>Live Online English &amp; Career Classes in India from ₹999/month | Learn With Smile</title>
    <meta name="description" content="Live online Spoken English, IELTS, Business English, Interview Prep and Career Counselling for Indian learners. Max 6 per batch or 1:1, from ₹999/month. Free demo on WhatsApp." />
    <!--
      Loading behaviour, before anything else runs. See the LOADING BEHAVIOUR
      section of src/styles.css for what each flag drives. Kept inline and tiny
      so it is in force for the very first paint, on the slowest connection,
      long before the app bundle has downloaded.
    -->
    <script>
      (function () {
        var d = document,
          root = d.documentElement,
          flags = ["js"];

        // `js` marks that scripting is available. Every rule that hides
        // something while it loads is scoped to it, so with JS off (or still
        // in flight) the prerendered page shows in full.
        var apply = function () {
          for (var i = 0; i < flags.length; i++) {
            if (!root.classList.contains(flags[i])) root.classList.add(flags[i]);
          }
        };
        apply();
        if (window.MutationObserver) {
          new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ["class"] });
        }

        // Fade photos in as they decode. `load` does not bubble, so this
        // listens in the capture phase — and because it is inline it works
        // from the first byte, not from whenever React finishes booting.
        var mark = function (e) {
          var t = e.target;
          if (t && t.tagName === "IMG" && t.hasAttribute("data-fade")) t.setAttribute("data-loaded", "");
        };
        d.addEventListener("load", mark, true);
        d.addEventListener("error", mark, true);

        // Wait for BOTH text fonts (Manrope, Sora) and icon fonts (Material Symbols)
        // before marking fonts-ready. This ensures proper UI rendering without FOUT.
        var fontsReady = function () {
          if (flags.indexOf("fonts-ready") < 0) {
            flags.push("fonts-ready");
            apply();
          }
        };

        var settle = function () {
          try {
            if (!d.fonts || !d.fonts.forEach) {
              fontsReady();
              return;
            }
            var textReady = false, iconReady = false;
            d.fonts.forEach(function (face) {
              if (face.family && face.status === "loaded") {
                if (face.family.indexOf("Manrope") >= 0 || face.family.indexOf("Sora") >= 0) textReady = true;
                if (face.family.indexOf("Material Symbols") >= 0) iconReady = true;
              }
            });
            if (textReady && iconReady) fontsReady();
          } catch (err) {
            fontsReady();
          }
        };

        try {
          if (d.fonts && d.fonts.load) {
            var promises = [
              d.fonts.load("400 24px Manrope"),
              d.fonts.load("700 24px Sora"),
              d.fonts.load("24px 'Material Symbols Rounded'")
            ];
            Promise.all(promises).then(settle).catch(fontsReady);
            if (d.fonts.addEventListener) d.fonts.addEventListener("loadingdone", settle);
          } else {
            fontsReady();
          }
        } catch (err) {
          fontsReady();
        }
        setTimeout(settle, 2000);
        setTimeout(settle, 4000);
        setTimeout(settle, 6000);
      })();
    </script>
    <style>
      /*
        Critical styles for the boot splash only — it has to be paintable
        before the stylesheet bundle arrives, which is the whole point of it.
        Everything else lives in src/styles.css.
      */
      html { background: #fff; }
      body { margin: 0; }
      .boot-splash { display: none; }
      #root:empty ~ .boot-splash {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 70;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background: #fff;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Shown only while #root is empty (see `#root:empty ~ .boot-splash`), i.e.
      on a bare SPA response. Prerendered pages ship their content inside #root
      and skip it entirely.
    -->
    <div class="boot-splash" aria-hidden="true">
      <div class="boot-splash-mark">LWS</div>
      <div class="boot-splash-track"></div>
      <div class="boot-splash-text">Learn With Smile</div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
