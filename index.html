<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      This file is only the SPA shell. `scripts/prerender.mjs` strips the title
      and description below and replaces them with each route's own metadata
      when it writes the static pages, so do not treat these as the site's
      real tags — edit src/lib/seo.ts instead.
    -->
    <!--
      The boot gate — holds the page back behind a plain veil until the
      stylesheet, the fonts, the app and the hero image are all in place, then
      fades it in finished. Both blocks below are filled in from
      src/lib/boot-script.ts by vite/boot-script-plugin.ts; edit them there,
      not here.

      This goes first, above every stylesheet link, and that position matters:
      a classic <script> does not execute until the stylesheets declared before
      it have loaded, so moving it below the fonts would hand the first paint
      to whatever the font CDN feels like doing today.
    -->
    <script data-boot-script></script>
    <style data-boot-style></style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Live Online English &amp; Career Classes in India from ₹999/month | Learn With Smile</title>
    <meta name="description" content="Live online Spoken English, IELTS, Business English, Interview Prep and Career Counselling for Indian learners. Max 6 per batch or 1:1, from ₹999/month. Free demo on WhatsApp." />
    <!--
      Open the connections to the font CDN now; the gate asks it for the
      stylesheets a moment later (see FONT_CSS in src/lib/boot-script.ts). A
      preconnect is a hint and blocks nothing, unlike the stylesheet links it
      replaces.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
